<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SVG sizing fixture</title>
    <link rel="stylesheet" href="../../tagbrush.css">
    <style>.sized-by-css { width: 48px; height: 12px; }</style>
</head>
<body>
    <div style="width: 360px">
        <svg id="wide" width="1200" height="300" viewBox="0 0 1200 300"></svg>
        <svg id="icon" width="24" height="24" viewBox="0 0 24 24"></svg>
        <svg id="height-only" height="24" viewBox="0 0 48 24"></svg>
        <svg id="no-viewbox" width="1200" height="300"></svg>
        <svg id="stretch" width="100%" height="120" viewBox="0 0 1200 300" preserveAspectRatio="none"></svg>
        <svg id="css" class="sized-by-css" width="1200" height="300" viewBox="0 0 1200 300"></svg>
    </div>
</body>
</html>

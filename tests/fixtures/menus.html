<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Menus fixture</title>
    <link rel="stylesheet" href="../../tagbrush.css">
</head>
<body>
    <main>
        <h1>Menus</h1>
        <p><button popovertarget="left-menu" id="left-button">Left</button></p>
        <div popover id="left-menu"><nav aria-label="Left"><ul><li><a href="#">Profile settings</a></li><li><a href="#">Sign out</a></li></ul></nav></div>
        <p style="text-align: end"><button popovertarget="right-menu" id="right-button">Right</button></p>
        <div popover id="right-menu"><nav aria-label="Right"><ul><li><a href="#">Profile settings</a></li><li><a href="#">Sign out</a></li></ul></nav></div>
        <p><button popovertarget="tip" id="tip-button">?</button></p>
        <div popover id="tip"><p>A plain popover stays centered.</p></div>
    </main>
</body>
</html>

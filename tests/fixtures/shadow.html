<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shadow DOM build fixture</title>
</head>
<body>
    <button id="outside">Outside the shadow root</button>
    <tb-demo id="light-host"></tb-demo>
    <tb-demo id="dark-host" data-theme="dark"></tb-demo>
    <script>
        customElements.define('tb-demo', class extends HTMLElement {
            constructor() {
                super();
                const root = this.attachShadow({ mode: 'open' });
                root.innerHTML = `
                    <link rel="stylesheet" href="../../tagbrush.shadow.css">
                    <main>
                        <h1>Inside the shadow root</h1>
                        <button>Button</button>
                        <input type="text">
                    </main>`;
                const link = root.querySelector('link');
                this.ready = new Promise((done) => link.addEventListener('load', done, { once: true }));
            }
        });
    </script>
</body>
</html>
